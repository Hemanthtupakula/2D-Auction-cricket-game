<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#111c38" />
      <stop offset="100%" stop-color="#080d1a" />
    </linearGradient>
    <linearGradient id="silhouetteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" fill="url(#bgGrad)" />

  <!-- Subtle Stadium Grid Pattern -->
  <circle cx="200" cy="200" r="160" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.6" />
  <circle cx="200" cy="200" r="120" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.4" />

  <!-- Cricket Silhouette Body -->
  <!-- Helmet & Head -->
  <circle cx="200" cy="120" r="42" fill="url(#silhouetteGrad)" />
  <!-- Helmet Grill / Visor Peak -->
  <path d="M220,110 L248,118 L240,128 L218,124 Z" fill="#64748b" opacity="0.8" />
  <path d="M212,126 L238,132 L236,138 L212,133 Z" fill="#64748b" opacity="0.6" />

  <!-- Neck & Torso -->
  <path d="M192,158 L208,158 L212,176 L188,176 Z" fill="url(#silhouetteGrad)" />
  <path d="M138,208 C138,180 162,176 200,176 C238,176 262,180 262,208 L280,310 L120,310 Z" fill="url(#silhouetteGrad)" />

  <!-- Shoulders & Jersey Detail -->
  <path d="M148,212 C168,188 232,188 252,212" fill="none" stroke="#334155" stroke-width="3" />
  <!-- Collar -->
  <path d="M184,178 L200,198 L216,178" fill="none" stroke="url(#accentGrad)" stroke-width="2" />

  <!-- Base Bat Graphic (Angled behind shoulder) -->
  <g transform="translate(130, 110) rotate(-35)">
    <rect x="0" y="0" width="16" height="50" rx="3" fill="#cbd5e1" opacity="0.8" />
    <rect x="-2" y="48" width="20" height="110" rx="4" fill="#94a3b8" opacity="0.9" />
    <line x1="8" y1="50" x2="8" y2="155" stroke="#64748b" stroke-width="1.5" />
  </g>

  <!-- Bottom Accent Banner -->
  <rect x="0" y="360" width="400" height="40" fill="#070c18" />
  <line x1="0" y1="360" x2="400" y2="360" stroke="url(#accentGrad)" stroke-width="2" filter="url(#glow)" />
  <text x="200" y="385" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="3" text-anchor="middle">AUCTION XI</text>
</svg>
