server:
  port: 0

spring:
  application:
    name: auction-xi-backend-test

  datasource:
    url: jdbc:h2:mem:auction_xi_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password: 
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false

  flyway:
    enabled: false

logging:
  level:
    com.auctionxi: WARN
    org.springframework: WARN
